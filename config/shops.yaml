defaults:
  request:
    user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
    delay_seconds: 1.0
    timeout: 20
    max_retries: 3
  storage:
    db_path: data/prices.db
  merge:
    fuzzy_threshold: 88   # rapidfuzz token_set_ratio cutoff (0-100)
    min_name_length: 4
