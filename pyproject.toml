[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "price_scraper"
version = "0.1.0"
description = "Daily multi-shop product price scraper with historical trends and cross-shop merge."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "rapidfuzz>=3.6",
    "tenacity>=8.2",
    "cloudscraper>=1.2.71",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# JS-rendered sites need a real browser; install with:
#   pip install -e ".[playwright]" && playwright install chromium
playwright = ["playwright>=1.40"]
# Regenerate docs/SETUP_GUIDE.pdf from the markdown source:
#   pip install -e ".[docs]"
#   python docs/render_pdf.py
docs = ["weasyprint>=60", "markdown2>=2.5"]

[project.scripts]
price_scraper = "price_scraper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
